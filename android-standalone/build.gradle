// Optional publisher AAB path. The delivered demo APK uses build.ps1, not Gradle.
plugins { id 'com.android.application' version '8.12.0' }

def publisherId = System.getenv('MCE_APPLICATION_ID')
def signingFile = System.getenv('MCE_KEYSTORE')
def signingAlias = System.getenv('MCE_KEY_ALIAS')
def signingPassword = System.getenv('MCE_STORE_PASSWORD')
def keyPassword = System.getenv('MCE_KEY_PASSWORD')
def hasPublisherSigning = publisherId && signingFile && signingAlias && signingPassword && keyPassword
def generated = layout.buildDirectory.dir('prepared')
// Only an explicit Gradle property configures networking. An absent property is empty.
def communityEndpoint = providers.gradleProperty('communityEndpoint').getOrElse('')
if (communityEndpoint) {
    def uri = new java.net.URI(communityEndpoint)
    if (!(communityEndpoint ==~ /https:\/\/[a-z0-9.-]+\/[A-Za-z0-9_.\/-]+/) ||
        uri.host == null || !uri.host.contains('.') || uri.host.endsWith('.') || uri.host.endsWith('.localhost') ||
        uri.host ==~ /[0-9.]+/ || uri.port != -1 || uri.userInfo != null || uri.query != null || uri.fragment != null ||
        uri.path.contains('//') || uri.normalize() != uri || uri.path == '/' ||
        uri.host.split(/\./).any { !(it ==~ /[a-z0-9](?:[a-z0-9-]{0,61}[a-z0-9])?/) }) {
        throw new GradleException('communityEndpoint must be a fixed canonical HTTPS URL with a DNS host and path.')
    }
}


android {
    namespace 'dev.student.myongjiexplorer.standalone'
    compileSdk 36
    buildToolsVersion '36.0.0'
    defaultConfig {
        applicationId publisherId ?: 'dev.student.myongjiexplorer.standalone'
        minSdk 24
        targetSdk 36
        versionCode 15
        versionName '0.6.3'
    }
    sourceSets.main {
        java.srcDirs = ["$buildDir/prepared/java"]
        manifest.srcFile 'publisher/AndroidManifest.xml'
        res.srcDirs = ['res', "$buildDir/prepared/res"]
        assets.srcDirs = ["$buildDir/prepared/assets"]
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_1_8; targetCompatibility JavaVersion.VERSION_1_8 }
    signingConfigs {
        if (hasPublisherSigning) {
            publisher { storeFile file(signingFile); storePassword signingPassword; keyAlias signingAlias; keyPassword keyPassword }
        }
    }
    buildTypes {
        release { minifyEnabled false; if (hasPublisherSigning) signingConfig signingConfigs.publisher }
    }
}

tasks.register('prepareOfflineContent') {
    inputs.file('../preview.html')
    inputs.dir('src')
    inputs.property('communityEndpoint', communityEndpoint)
    inputs.file('../mobile/assets/icon.png')
    outputs.dir(generated)
    doLast {
        def page = file('../preview.html')
        def hash = java.security.MessageDigest.getInstance('SHA-256').digest(page.bytes).encodeHex().toString()
        if (hash != '0c17dda6e51204a9ac77a82f1760f8269c7dad50e57fa888bad48d0d8f8ea1cf') throw new GradleException('Review the changed HTML before updating its pinned hash.')
        copy { from 'src'; into "$buildDir/prepared/java"; exclude '**/CommunityEndpoint.java' }
        def endpointSource = file("$buildDir/prepared/java/dev/student/myongjiexplorer/standalone/CommunityEndpoint.java")
        endpointSource.parentFile.mkdirs()
        endpointSource.setText('package dev.student.myongjiexplorer.standalone; public final class CommunityEndpoint { public static final String URL = "' + communityEndpoint + '"; private CommunityEndpoint() {} }', 'UTF-8')
        copy { from page; into "$buildDir/prepared/assets"; rename 'preview.html', 'index.html' }
        copy { from '../mobile/assets/icon.png'; into "$buildDir/prepared/res/drawable-nodpi"; rename 'icon.png', 'ic_launcher_art.png' }
    }
}
tasks.named('preBuild').configure { dependsOn 'prepareOfflineContent' }
gradle.taskGraph.whenReady { graph ->
    if (graph.allTasks.any { it.name.toLowerCase().contains('release') } && !hasPublisherSigning) {
        throw new GradleException('Publisher release requires MCE_APPLICATION_ID, MCE_KEYSTORE, MCE_KEY_ALIAS, MCE_STORE_PASSWORD and MCE_KEY_PASSWORD. Do not use the demonstration key for publication.')
    }
}
