plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}
group = 'expo.modules.campusnaver'
version = '0.1.0'
android {
  namespace 'expo.modules.campusnaver'
  defaultConfig { versionCode 1; versionName '0.1.0' }
}
repositories { maven { url 'https://repository.map.naver.com/archive/maven' } }
dependencies { implementation 'com.naver.maps:map-sdk:3.24.0' }
