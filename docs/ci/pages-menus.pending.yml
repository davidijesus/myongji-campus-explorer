name: Campus site and official menus

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '17 7,11,17 * * *'
      timezone: Asia/Seoul

permissions:
  contents: read

concurrency:
  group: campus-pages-and-menus
  cancel-in-progress: false

env:
  TZ: Asia/Seoul

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pages: read
    steps:
      - name: Check out published source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
          cache: npm
      - name: Install locked build dependencies
        run: npm ci --ignore-scripts
      - name: Test parsers, failure retention and clients
        run: npm test
      - name: Build offline app shell
        run: npm run build:pwa
      - name: Refresh official Korean menus from the last published snapshot
        run: node scripts/build-pages-menu-feed.cjs
      - name: Keep collection diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: official-menu-collection-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/pages-menu-run/status.json
          if-no-files-found: ignore
          retention-days: 7
      - name: Read existing Pages configuration
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - name: Upload complete site and validated feed
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: pwa

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy validated site and menus
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
