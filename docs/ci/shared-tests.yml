name: Shared code and content tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  shared:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build:pwa
      - run: npm test
      - run: node scripts/check-native-syntax.cjs
# Browser, Android and iOS device validation are documented separately.
